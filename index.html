<title>ST-CITY Laws</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    margin:0;
    background:#f4f5f7;
    color:#20262d;
    font-family:Georgia,"Times New Roman",serif;
}

button,input,select{

}

.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid #d8dde2;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header-inner{
    width:min(1450px,100%);
    margin:auto;
    padding:0 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:44px;
    height:44px;
    border:1px solid #bfc8cf;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f8fafb;
    color:#194d70;
    font-size:25px;
}

.brand-title{
    font:bold 20px Arial,sans-serif;
    color:#173e5c;
}

.brand-sub{
    color:#879098;
    font:9px Arial,sans-serif;
    letter-spacing:1px;
    margin-top:3px;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.btn{
    border:1px solid #cbd3d9;
    background:#fff;
    border-radius:5px;
    padding:9px 12px;
    cursor:pointer;
    color:#45535d;
}

.btn:hover{
    background:#f1f4f6;
}

.search-area{
    background:#fff;
    border-bottom:1px solid #dce1e5;
}

.search-inner{
    width:min(1450px,100%);
    margin:auto;
    padding:14px 25px;
}

.search{
    position:relative;
}

.search input{
    width:100%;
    height:47px;
    border:1px solid #bcc6ce;
    border-radius:5px;
    outline:none;
    padding:0 45px;
    font-size:14px;
}

.search input:focus{
    border-color:#316889;
    box-shadow:0 0 0 3px rgba(49,104,137,.10);
}

.search-icon{
    position:absolute;
    left:15px;
    top:12px;
    font:21px Arial,sans-serif;
    color:#71808a;
}

.search-clear{
    position:absolute;
    right:5px;
    top:5px;
    height:35px;
    width:35px;
    border:0;
    background:none;
    cursor:pointer;
    font-size:20px;
    color:#7b858c;
}

.search-help{
    margin-top:7px;
    color:#7d878e;
    font:10px Arial,sans-serif;
}

.layout{
    width:min(1450px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:275px 1fr;
}

.sidebar{
    background:#f8f9fa;
    border-right:1px solid #d9dee2;
    min-height:calc(100vh - 140px);
}

.side-title{
    padding:21px 18px 9px;
    color:#7d878e;
    font:bold 10px Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
}

.side-btn{
    width:100%;
    border:0;
    background:none;
    border-left:3px solid transparent;
    padding:10px 16px;
    text-align:left;
    display:flex;
    justify-content:space-between;
    gap:5px;
    color:#46545e;
    cursor:pointer;
    font:12px Arial,sans-serif;
}

.side-btn:hover{
    background:#edf1f3;
}

.side-btn.active{
    background:#e6eef3;
    border-left-color:#245c7e;
    color:#154b6e;
    font-weight:bold;
}

.side-count{
    color:#8a949b;
}

.side-line{
    height:1px;
    background:#dce1e5;
    margin:14px 0;
}

main{
    padding:30px 36px 70px;
    min-width:0;
}

.welcome{
    background:#fff;
    border:1px solid #d5dbe0;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
    padding:35px;
    margin-bottom:20px;
}

.small-title{
    color:#7b858c;
    font:bold 10px Arial,sans-serif;
    letter-spacing:1.3px;
}

.welcome h1{
    color:#183e5c;
    font-weight:normal;
    font-size:34px;
    margin:11px 0 9px;
}

.welcome p{
    max-width:900px;
    color:#68747c;
    font-size:15px;
    line-height:1.75;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:7px 11px;
    border:1px solid #b9d5c3;
    background:#f2f8f4;
    color:#34704b;
    border-radius:4px;
    font:bold 10px Arial,sans-serif;
}

.stats{
    display:flex;
    gap:45px;
    flex-wrap:wrap;
    border-top:1px solid #e0e4e7;
    margin-top:25px;
    padding-top:18px;
}

.stat strong{
    display:block;
    color:#214a65;
    font:bold 22px Arial,sans-serif;
}

.stat span{
    color:#808a91;
    font:10px Arial,sans-serif;
    text-transform:uppercase;
}

.category{
    background:#fff;
    border:1px solid #d5dbe0;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    margin-bottom:16px;
}

.category-head{
    background:#f8f9fa;
    border-bottom:1px solid #dce1e5;
    padding:17px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
}

.category-head:hover{
    background:#f1f4f6;
}

.category-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.category-number{
    color:#18567c;
    font-weight:bold;
}

.category-name{
    color:#294354;
    font-weight:bold;
    font-size:15px;
}

.category-count{
    color:#7c878f;
    font:10px Arial,sans-serif;
}

.laws{
    display:none;
}

.category.open .laws{
    display:block;
}

.law{
    display:grid;
    grid-template-columns:100px 1fr 35px;
    gap:15px;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid #e3e6e9;
    cursor:pointer;
}

.law:last-child{
    border-bottom:0;
}

.law:hover{
    background:#fafbfc;
}

.law-number{
    color:#687984;
    font:bold 11px Arial,sans-serif;
}

.law-name{
    color:#15557d;
    font-weight:bold;
    font-size:15px;
}

.law-description{
    color:#7c878e;
    font:11px Arial,sans-serif;
    margin-top:4px;
}

.star{
    border:0;
    background:none;
    cursor:pointer;
    color:#b3bac0;
    font-size:20px;
}

.star.active{
    color:#a37b28;
}

.breadcrumb{
    color:#7b858d;
    font:11px Arial,sans-serif;
    margin-bottom:10px;
}

.breadcrumb button{
    border:0;
    background:none;
    color:#175a87;
    cursor:pointer;
    padding:0;
}

.toolbar{
    min-height:47px;
    background:#f8f9fa;
    border:1px solid #d4dade;
    border-bottom:0;
    padding:7px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    font:11px Arial,sans-serif;
}

.toolbar-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.document{
    background:#fff;
    border:1px solid #d4dade;
    box-shadow:0 3px 15px rgba(0,0,0,.055);
    padding:65px 80px;
}

.document-head{
    text-align:center;
    max-width:1000px;
    margin:auto;
}

.document-number{
    color:#707d85;
    font:bold 11px Arial,sans-serif;
    letter-spacing:1px;
}

.document h1{
    color:#173d5b;
    font-size:35px;
    font-weight:normal;
    line-height:1.25;
    margin:14px 0 9px;
}

.document-subtitle{
    color:#69757e;
    font-size:15px;
}

.consolidated{
    display:inline-block;
    color:#59636b;
    font-style:italic;
    font-size:14px;
    border-top:1px solid #dce1e4;
    margin-top:19px;
    padding-top:12px;
}

.metadata{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    margin-top:20px;
    padding-top:13px;
    border-top:1px solid #dce1e4;
    color:#7b858d;
    font:10px Arial,sans-serif;
}

.metadata strong{
    color:#3e4e58;
}

.part{
    margin-top:55px;
}

.part-line{
    height:2px;
    background:#234f6d;
    margin-bottom:15px;
}

.part-title{
    text-align:center;
    color:#294659;
    font-size:19px;
    font-weight:bold;
}

.part-subtitle{
    text-align:center;
    color:#7b858d;
    font-size:13px;
    margin-top:5px;
}

.paragraph{
    margin-top:43px;
    scroll-margin-top:100px;
}

.paragraph-heading{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:10px;
}

.paragraph-symbol{
    color:#15567f;
    font-weight:bold;
    font-size:19px;
}

.paragraph-title{
    color:#2a4151;
    font-size:16px;
    font-weight:bold;
}

.paragraph-intro{
    font-size:16px;
    line-height:1.82;
    text-align:justify;
}

.paragraphs{
    margin-top:12px;
}

.odst{
    display:grid;
    grid-template-columns:42px 1fr;
    gap:6px;
    padding-left:20px;
    margin:9px 0;
}

.odst-num{
    color:#596b77;
    font-size:15px;
    font-weight:bold;
}

.odst-text{
    color:#282f34;
    font-size:15.5px;
    line-height:1.76;
    text-align:justify;
}

.sanction{
    margin-top:40px;
    border-left:4px solid #8c6d31;
    background:#faf8f1;
    padding:16px 19px;
    color:#62583f;
    font:12px Arial,sans-serif;
    line-height:1.7;
}

.info{
    margin-top:30px;
    border-left:4px solid #607b8e;
    background:#f4f7f8;
    padding:15px 18px;
    color:#5d6c75;
    font:11px Arial,sans-serif;
    line-height:1.7;
}

.amendments{
    margin-top:38px;
    border:1px solid #d6dce0;
    background:#f8f9fa;
}

.amendments-title{
    padding:13px 16px;
    border-bottom:1px solid #d9dee2;
    font:bold 10px Arial,sans-serif;
    color:#52616c;
}

.amendments-content{
    padding:15px 17px;
    color:#697680;
    font:11px Arial,sans-serif;
}

.document-footer{
    border-top:1px solid #d9dee2;
    margin-top:45px;
    padding-top:16px;
    text-align:center;
    color:#78838a;
    font:10px Arial,sans-serif;
}

.results{
    background:#fff;
    border:1px solid #d4dade;
}

.results-header{
    padding:18px 20px;
    border-bottom:1px solid #dce1e5;
    color:#68757d;
    font:12px Arial,sans-serif;
}

.result{
    padding:17px 21px;
    border-bottom:1px solid #e1e5e8;
    cursor:pointer;
}

.result:hover{
    background:#f8fafb;
}

.result-number{
    color:#70808a;
    font:bold 10px Arial,sans-serif;
}

.result-title{
    color:#14557f;
    font-weight:bold;
    font-size:16px;
    margin-top:4px;
}

.result-description{
    color:#7b858d;
    font:11px Arial,sans-serif;
    margin-top:5px;
}

.empty{
    padding:70px 20px;
    text-align:center;
    color:#7a858c;
    font:13px Arial,sans-serif;
}

.copyright{
    text-align:center;
    color:#7c868d;
    font:10px Arial,sans-serif;
    padding:25px;
}

@media(max-width:850px){
    .layout{
        grid-template-columns:220px 1fr;
    }

    main{
        padding:20px;
    }

    .document{
        padding:40px 35px;
    }
}

@media(max-width:650px){

    .header{
        height:62px;
    }

    .header-inner{
        padding:0 12px;
    }

    .header-buttons{
        display:none;
    }

    .brand-title{
        font-size:17px;
    }

    .brand-sub{
        display:none;
    }

    .search-inner{
        padding:10px;
    }

    .layout{
        display:block;
    }

    .sidebar{
        display:none;
    }

    main{
        padding:10px;
    }

    .welcome{
        padding:23px 18px;
    }

    .welcome h1{
        font-size:27px;
    }

    .document{
        padding:32px 17px;
    }

    .document h1{
        font-size:27px;
    }

    .odst-text,
    .paragraph-intro{
        text-align:left;
    }

    .law{
        grid-template-columns:70px 1fr 30px;
        padding:14px 12px;
    }

    .law-description{
        display:none;
    }

    .toolbar{
        flex-direction:column;
        align-items:flex-start;
    }
}

@media print{

    @page{
        size:A4;
        margin:18mm;
    }

    body{
        background:#fff;
    }

    .header,
    .search-area,
    .sidebar,
    .toolbar,
    .breadcrumb,
    .welcome{
        display:none!important;
    }

    .layout{
        display:block;
    }

    main{
        padding:0;
    }

    .document{
        border:0;
        box-shadow:none;
        padding:0;
    }

    .document-footer{
        display:block;
    }

    .odst-text,
    .paragraph-intro{
        font-size:12pt;
    }
}
</style>
</head>

function getParagraphs(law){

    const sections=createSections(law);

    return sections.map((section,index)=>({
        number:index+1,
        title:section[0],
        texts:section[1]
    }));
}

/* ==========================================================
   ESCAPE
========================================================== */

function esc(value){
    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

        id,
        ...historyList.filter(x=>x!==id)
    ].slice(0,30);

    localStorage.setItem(
        "stcity-history",
        JSON.stringify(historyList)
    );

    renderLaw(law);

        top:0,

    if(targetParagraph){

}

document.getElementById("search").addEventListener(
"input",
function(){

    clearTimeout(window.searchTimeout);

    window.searchTimeout=setTimeout(
        ()=>searchLaws(this.value),
        100
    );
});


function searchLaws(query){

    query=query.trim().toLowerCase();

    if(!query){
        home();
        return;
    }

    const match=query.match(/(\d+)\s*\/\s*2026/);

    if(match){

        const law=laws.find(
            x=>x.number===`${match[1]}/2026`
        );

        if(law){
            openLaw(law.id);
            return;
        }
    }

    const results=laws.filter(law=>{

        const paragraphs=getParagraphs(law);

        let text=[
            law.number,
            law.title,
            law.category,
            law.description
        ].join(" ").toLowerCase();

        paragraphs.forEach(p=>{
            text+=" "+p.number+" "+p.title;
            p.texts.forEach(t=>text+=" "+t);
        });

        return text.includes(query);
    });

    showResults(query,results);
}

    document.querySelectorAll(".side-btn")
    .forEach(x=>x.classList.remove("active"));
}


/* ==========================================================
   KEYBOARD
========================================================== */

document.addEventListener("keydown",event=>{

    if(
        (event.ctrlKey||event.metaKey)
        &&
        event.key.toLowerCase()==="k"
    ){

        event.preventDefault();

        document.getElementById("search").focus();

    }

    if(event.key==="Escape"){
        clearSearch();
    }
});


/* ==========================================================
   START
========================================================== */

buildSidebar();
updateFavoriteCount();
home();

</script>
