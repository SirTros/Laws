.layout{width:min(1500px,100%);margin:auto;display:grid;grid-template-columns:285px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--border);min-height:calc(100vh - 134px);padding-bottom:25px}.side-title{padding:20px 18px 9px;color:var(--muted);font:bold 10px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}.side-btn{width:100%;border:0;background:none;border-left:3px solid transparent;padding:10px 16px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--text);cursor:pointer;font:12px Arial,sans-serif}.side-btn:hover{background:var(--panel2)}.side-btn.active{background:var(--blue2);border-left-color:var(--blue);color:var(--blue);font-weight:bold}.side-count{color:var(--muted);font-size:10px}.side-line{height:1px;background:var(--border);margin:13px 0}
main{min-width:0;padding:28px 35px 80px}.home-hero{background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);padding:34px;border-radius:9px;margin-bottom:18px}.hero-top{display:flex;justify-content:space-between;gap:25px;align-items:flex-start}.small-title{color:var(--muted);font:bold 10px Arial,sans-serif;letter-spacing:1.4px}.home-hero h1{margin:10px 0;font-size:35px;font-weight:normal;color:var(--blue)}.home-hero p{max-width:950px;color:var(--muted);line-height:1.75;font-size:15px}.status{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #b8d4c1;background:var(--green-bg);color:var(--green);border-radius:5px;font:bold 10px Arial,sans-serif}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:27px}.stat{border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:17px}.stat strong{display:block;color:var(--blue);font:bold 23px Arial,sans-serif}.stat span{display:block;margin-top:4px;color:var(--muted);font:10px Arial,sans-serif;text-transform:uppercase}
.section-title{color:var(--blue);font-size:20px;margin:27px 0 12px}.category{background:var(--panel);border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.035);margin-bottom:13px;border-radius:8px;overflow:hidden}.category-head{background:var(--panel2);border-bottom:1px solid var(--border);padding:16px 19px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}.category-head:hover{background:var(--blue2)}.category-title{display:flex;align-items:center;gap:11px}.category-icon{width:32px;height:32px;border-radius:7px;background:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:18px}.category-number{color:var(--blue);font:bold 11px Arial,sans-serif}.category-name{color:var(--text);font-weight:bold;font-size:15px}.category-count{color:var(--muted);font:10px Arial,sans-serif}.laws{display:none}.category.open .laws{display:block}
.law{display:grid;grid-template-columns:100px 1fr 38px;gap:14px;align-items:center;padding:15px 19px;border-bottom:1px solid var(--border);cursor:pointer}.law:last-child{border-bottom:0}.law:hover{background:var(--panel2)}.law-number{color:var(--muted);font:bold 10px Arial,sans-serif}.law-name{color:var(--blue);font-weight:bold;font-size:15px}.law-description{color:var(--muted);font:11px Arial,sans-serif;margin-top:4px;line-height:1.45}.star{width:35px;height:35px;border:1px solid transparent;background:none;cursor:pointer;border-radius:7px;font-size:21px;color:#aeb6bc}.star:hover{background:var(--panel2)}.star.active{color:var(--gold)}
.breadcrumb{color:var(--muted);font:11px Arial,sans-serif;margin-bottom:10px}.breadcrumb button{border:0;background:none;color:var(--blue);cursor:pointer;padding:0}.toolbar{min-height:47px;background:var(--panel2);border:1px solid var(--border);border-bottom:0;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:11px Arial,sans-serif;border-radius:8px 8px 0 0}.toolbar-buttons{display:flex;flex-wrap:wrap;gap:5px}

.part{margin-top:52px}.part-line{height:2px;background:var(--blue);margin-bottom:14px}.part-title{text-align:center;color:var(--text);font-size:19px;font-weight:bold}.part-subtitle{text-align:center;color:var(--muted);font-size:13px;margin-top:5px}.paragraph{margin-top:43px;scroll-margin-top:100px}.paragraph-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}.paragraph-symbol{color:var(--blue);font-weight:bold;font-size:19px}.paragraph-title{color:var(--text);font-size:16px;font-weight:bold}.odst{display:grid;grid-template-columns:42px 1fr;gap:6px;padding-left:20px;margin:10px 0}.odst-num{color:var(--muted);font-size:15px;font-weight:bold}.odst-text{color:var(--text);font-size:15px;line-height:1.78;text-align:justify}.sanction{margin-top:40px;border-left:4px solid var(--gold);background:rgba(190,160,75,.08);padding:16px 19px;color:var(--text);font:12px Arial,sans-serif;line-height:1.7}.info{margin-top:30px;border-left:4px solid #607b8e;background:var(--panel2);padding:15px 18px;color:var(--muted);font:11px Arial,sans-serif;line-height:1.7}.amendments{margin-top:38px;border:1px solid var(--border);background:var(--panel2)}.amendments-title{padding:13px 16px;border-bottom:1px solid var(--border);font:bold 10px Arial,sans-serif;color:var(--muted)}.amendments-content{padding:15px 17px;color:var(--muted);font:11px Arial,sans-serif;line-height:1.7}.document-footer{border-top:1px solid var(--border);margin-top:45px;padding-top:16px;text-align:center;color:var(--muted);font:10px Arial,sans-serif}
.results{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}.results-header{padding:18px 20px;border-bottom:1px solid var(--border);color:var(--muted);font:12px Arial,sans-serif}.result{padding:17px 21px;border-bottom:1px solid var(--border);cursor:pointer}.result:hover{background:var(--panel2)}.result-number{color:var(--muted);font:bold 10px Arial,sans-serif}.result-title{color:var(--blue);font-weight:bold;font-size:16px;margin-top:4px}.result-description{color:var(--muted);font:11px Arial,sans-serif;margin-top:5px}.empty{padding:70px 20px;text-align:center;color:var(--muted);font:13px Arial,sans-serif}.empty-icon{font-size:42px;margin-bottom:12px}.copyright{text-align:center;color:var(--muted);font:10px Arial,sans-serif;padding:25px}.top-button{position:fixed;right:20px;bottom:20px;width:45px;height:45px;border:1px solid var(--border);background:var(--panel);color:var(--blue);border-radius:50%;cursor:pointer;box-shadow:var(--shadow);display:none;z-index:90;font-size:18px}.mobile-nav{display:none}
.notice{padding:12px 15px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--muted);font:11px Arial,sans-serif;margin-bottom:14px}

@media print{@page{size:A4;margin:18mm}body{background:#fff;color:#000}.header,.search-area,.sidebar,.toolbar,.breadcrumb,.home-hero,.mobile-nav,.top-button{display:none!important}.layout{display:block}main{padding:0}.document{border:0;box-shadow:none;padding:0}.odst-text{font-size:12pt}}
.ticket-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin:18px 0;box-shadow:var(--shadow)}.ticket-panel h2{margin:4px 0 5px;font-size:23px}.ticket-panel p{margin:0;color:var(--muted);font:12px Arial,sans-serif}.ticket-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.ticket{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--panel2);display:flex;flex-direction:column;gap:5px}.ticket b{font:12px Arial,sans-serif;color:var(--blue)}.ticket strong{font-size:20px}.ticket span{font:10px Arial,sans-serif;color:var(--muted)}.ticket-note{margin-top:12px;padding:11px;background:var(--blue2);border-radius:7px;font:11px Arial,sans-serif}@media(max-width:680px){.ticket-grid{grid-template-columns:1fr 1fr}.ticket-panel{padding:15px}}</style>

["DPST-C · Městská doprava","🚌"]
];

const lawNames={
"Veřejný pořádek":[["Zákon o veřejném pořádku","Chrání klidné, bezpečné a důstojné soužití obyvatel ST-CITY."],["Zákon o veřejném obtěžování","Upravuje jednání, kterým osoba bezdůvodně obtěžuje, zastrašuje nebo omezuje ostatní."],["Zákon o ochraně veřejného majetku","Chrání lavičky, osvětlení, koše, zastávky a další veřejný majetek před poškozením."],["Zákon o bezpečném užívání ulic","Stanovuje povinnost chovat se na veřejných místech tak, aby nebyli ohrožováni ostatní."]],
"Noční klid a hluk":[["Zákon o nočním klidu","Stanovuje dobu nočního klidu a chrání právo obyvatel na nerušený odpočinek."],["Zákon o rušení nočního klidu","Zakazuje úmyslné nebo nepřiměřené rušení nočního klidu."],["Zákon o nadměrném hluku","Upravuje omezení hluku, který nepřiměřeně zatěžuje okolí."],["Zákon o hlučných činnostech","Stanovuje pravidla pro používání hlučných zařízení v obytných oblastech."]],
"Doprava":[["Zákon o silničním provozu ST-CITY","Stanovuje základní pravidla bezpečného pohybu vozidel, chodců a dalších účastníků provozu."],["Zákon o bezpečnosti chodců","Posiluje ochranu chodců a stanovuje povinnost řidičů dbát zvýšené opatrnosti."],["Zákon o jízdních kolech","Upravuje bezpečný provoz jízdních kol na komunikacích a veřejných místech."],["Zákon o koloběžkách","Stanovuje pravidla bezpečného používání koloběžek a ochrany ostatních účastníků provozu."]],
"Parkování":[["Zákon o parkování vozidel","Upravuje pravidla zastavení, stání a používání parkovacích míst."],["Zákon o parkovacích zónách","Stanovuje režim jednotlivých parkovacích oblastí a podmínky parkování."],["Zákon o vyhrazených místech","Chrání parkovací místa určená pro osoby nebo účely se zvláštním oprávněním."],["Zákon o dlouhodobém stání","Upravuje podmínky dlouhodobého ponechání vozidla na veřejném prostoru."]],
"Bezpečnost":[["Zákon o ochraně života a zdraví","Chrání život, zdraví, tělesnou integritu a bezpečí všech osob na území ST-CITY."],["Zákon proti násilí a napadení","Zakazuje úmyslné násilné jednání vůči jiné osobě a stanovuje odpovědnost za jeho následky."],["Zákon proti sexuálnímu násilí a znásilnění","Chrání každou osobu před znásilněním, sexuálním násilím, nátlakem a jednáním bez svobodného souhlasu."],["Zákon o ochraně dětí a zranitelných osob","Poskytuje zvýšenou ochranu dětem a zranitelným osobám před násilím, zneužíváním, zanedbáváním a vykořisťováním."]],
"Veřejná prostranství":[["Zákon o užívání veřejných prostranství","Upravuje používání ulic, náměstí, parků a dalších veřejných míst."],["Zákon o čistotě veřejných míst","Stanovuje povinnost neznečišťovat veřejná prostranství a odstraňovat způsobené znečištění."],["Zákon o městském vybavení","Chrání zařízení umístěná ve veřejném prostoru před poškozením a zneužitím."],["Zákon o dočasném zabrání prostoru","Upravuje podmínky dočasného využití veřejného prostoru pro akce nebo práce."]],

function sanctionFor(law){
 if(law.category==="DPST-C · Městská doprava") return "Za porušení přepravních pravidel může být uloženo opatření nebo přirážka k jízdnému podle závažnosti a pravidel DPST-C. Závažné jednání může být předáno příslušnému orgánu.";
 const map={"Doprava":"Za porušení pravidel může být podle závažnosti uložena pokuta, zákaz určité činnosti nebo jiné opatření stanovené právním řádem ST-CITY.","Parkování":"Za neoprávněné parkování může být uložena pokuta a v odůvodněných případech může být vozidlo odstraněno.","Odpady":"Za neoprávněné nakládání s odpadem může být uložena pokuta a povinnost odstranit následky porušení.","Zvířata":"Za porušení povinností chovatele může být uložena pokuta, nápravné opatření nebo omezení chovu.","Požární ochrana":"Za porušení požárních povinností může být uložena pokuta podle míry vzniklého rizika a následků.","Noční klid a hluk":"Za závažné nebo opakované rušení nočního klidu či nadměrný hluk může být uložena pokuta nebo jiné nápravné opatření.","Bezpečnost":"Za závažné protiprávní jednání může být uložena sankce podle závažnosti jednání a věci mohou být předány příslušným orgánům.","Školství":"Porušení povinností ve škole může být řešeno výchovným, ochranným nebo nápravným opatřením podle závažnosti případu."};return map[law.category]||"Za porušení tohoto zákona může být podle závažnosti uloženo napomenutí, pokuta nebo nápravné opatření.";
}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
let favorites=JSON.parse(localStorage.getItem("stcity-favorites")||"[]");
let historyList=JSON.parse(localStorage.getItem("stcity-history")||"[]");
if(localStorage.getItem("stcity-theme")==="dark")document.body.classList.add("dark");

function buildSidebar(){
 const c=document.getElementById("sideCategories");c.innerHTML="";
 categories.forEach((cat,i)=>{const count=laws.filter(x=>x.category===cat[0]).length;const b=document.createElement("button");b.className="side-btn";b.innerHTML=`<span>${cat[1]} ${esc(cat[0])}</span><span class="side-count">${count}</span>`;b.onclick=()=>{showCategory(cat[0]);closeMobileMenu()};c.appendChild(b)});
 document.getElementById("allCount").textContent=laws.length;
}
function lawHTML(law){const fav=favorites.includes(law.id);return `<div class="law" onclick="openLaw(${law.id})"><div class="law-number">č. ${law.number}</div><div><div class="law-name">${law.icon} ${esc(law.title)}</div><div class="law-description">${esc(law.description)}</div></div><button class="star ${fav?"active":""}" title="${fav?"Odebrat z oblíbených":"Přidat do oblíbených"}" onclick="event.stopPropagation();toggleFavorite(${law.id})">${fav?"★":"☆"}</button></div>`}
function categoryHTML(category,number,arr,icon){return `<section class="category"><div class="category-head" onclick="this.parentElement.classList.toggle('open')"><div class="category-title"><div class="category-icon">${icon}</div><div><div class="category-number">§ ${number}</div><div class="category-name">${esc(category)}</div></div></div><span class="category-count">${arr.length} zákonů · ▾</span></div><div class="laws">${arr.map(lawHTML).join("")}</div></section>`}
function home(){
 activateAll();const paragraphCount=laws.reduce((n,l)=>n+createSections(l).length,0);
 main.innerHTML=`<section class="home-hero"><div class="hero-top"><div><div class="small-title">⚖️ ST-CITY · ELEKTRONICKÁ SBÍRKA</div><h1>Sbírka zákonů ST-CITY</h1><p>Vítej v elektronické sbírce fiktivního právního systému ST-CITY. 📚 Procházej zákony, vyhledávej konkrétní ustanovení, pravidla DPST-C a ukládej si své oblíbené předpisy.</p><div class="status">🟢 SBÍRKA AKTIVNÍ</div><div class="quick-actions"><button class="quick-action" onclick="showAllLaws()">📚 Všechny zákony</button><button class="quick-action" onclick="favoritesPage()">⭐ Oblíbené</button><button class="quick-action" onclick="historyPage()">🕘 Historie</button><button class="quick-action" onclick="aboutPage()">ℹ️ O systému</button><button class="quick-action" onclick="toggleTheme()">🌙 Změnit motiv</button></div></div></div><div class="stats"><div class="stat"><strong>${laws.length}</strong><span>📜 zákonů</span></div><div class="stat"><strong>${categories.length}</strong><span>🏛️ oblastí</span></div><div class="stat"><strong>${paragraphCount}</strong><span>§ paragrafů</span></div><div class="stat"><strong>${favorites.length}</strong><span>⭐ oblíbených</span></div></div></section><div class="notice">ℹ️ ST-CITY Laws je fiktivní právní systém. DPST-C je fiktivní městský dopravní podnik v rámci projektu ST-CITY.</div><div class="ticket-panel"><div class="ticket-panel-head"><div><div class="small-title">🎫 DPST-C · TARIF</div><h2>Jízdní doklady</h2><p>Ukázkový tarif fiktivního DPST-C. Ceny a platnost jsou součástí projektu ST-CITY.</p></div></div><div class="ticket-grid"><div class="ticket"><b>🎫 30 minut</b><strong>30 Kč</strong><span>přestupní · 30 min</span></div><div class="ticket"><b>🎫 90 minut</b><strong>40 Kč</strong><span>přestupní · 90 min</span></div><div class="ticket"><b>🎫 24 hodin</b><strong>120 Kč</strong><span>neomezeně · 24 h</span></div><div class="ticket"><b>📅 30 dní</b><strong>900 Kč</strong><span>předplatní · 30 dní</span></div></div><div class="ticket-note">ℹ️ Jízdenku je nutné mít platnou před zahájením přepravy. Elektronická jízdenka musí být před kontrolou aktivovaná.</div></div><div class="section-title">📚 Právní oblasti</div><div id="categoryList"></div><div class="copyright">⚖️ ST-CITY Laws · © SirTros - SirTros-city</div>`;
 const list=document.getElementById("categoryList");categories.forEach((cat,i)=>list.insertAdjacentHTML("beforeend",categoryHTML(cat[0],i+1,laws.filter(x=>x.category===cat[0]),cat[1])));
}
function showAllLaws(){activateAll();main.innerHTML=`<div class="breadcrumb">🏠 Domů · 📚 Všechny zákony</div><section class="category"><div class="category-head"><div class="category-title"><div class="category-icon">📚</div><div class="category-name">Všechny zákony</div></div><span class="category-count">${laws.length} zákonů</span></div><div class="laws" style="display:block">${laws.map(lawHTML).join("")}</div></section><div class="copyright">⚖️ ST-CITY Laws · © SirTros</div>`}
function showCategory(category){deactivateAll();const arr=laws.filter(x=>x.category===category),cat=categories.find(x=>x[0]===category);main.innerHTML=`<div class="breadcrumb"><button onclick="home()">🏠 Domů</button> · ${cat?.[1]||"📚"} ${esc(category)}</div><section class="category"><div class="category-head"><div class="category-title"><div class="category-icon">${cat?.[1]||"📚"}</div><div class="category-name">${esc(category)}</div></div><span class="category-count">${arr.length} zákonů</span></div><div class="laws" style="display:block">${arr.map(lawHTML).join("")}</div></section><div class="copyright">⚖️ ST-CITY Laws · © SirTros</div>`;closeMobileMenu()}
function openLaw(id){const law=laws.find(x=>x.id===id);if(!law)return;historyList=[id,...historyList.filter(x=>x!==id)].slice(0,30);localStorage.setItem("stcity-history",JSON.stringify(historyList));updateHistoryCount();renderLaw(law);history.replaceState(null,"","#law-"+id);window.scrollTo({top:0,behavior:"smooth"});closeMobileMenu()}
function renderLaw(law){
 const sections=createSections(law),favorite=favorites.includes(law.id);
 let content="";sections.forEach((s,i)=>{content+=`<section class="paragraph" id="p-${law.id}-${i+1}"><div class="paragraph-heading"><span class="paragraph-symbol">§ ${i+1}</span><span class="paragraph-title">${esc(s[0])}</span></div><div>${s[1].map((t,j)=>`<div class="odst"><div class="odst-num">(${j+1})</div><div class="odst-text">${esc(t)}</div></div>`).join("")}</div></section>`});
 main.innerHTML=`<div class="breadcrumb"><button onclick="home()">🏠 Domů</button> · <button onclick="showCategory('${esc(law.category)}')">${law.icon} ${esc(law.category)}</button> · Zákon č. ${law.number}</div><div class="toolbar"><span>📜 Zákon č. ${law.number}</span><div class="toolbar-buttons"><button class="btn" onclick="toggleFavorite(${law.id})">${favorite?"⭐ Oblíbené":"☆ Oblíbené"}</button><button class="btn" onclick="copyLaw(${law.id})">🔗 Odkaz</button><button class="btn" onclick="window.print()">🖨️ Tisk</button><button class="btn" onclick="showCategory('${esc(law.category)}')">← Zpět</button><button class="btn primary" onclick="home()">🏠 Domů</button></div></div><article class="document"><header class="document-head"><div class="document-number">${law.icon} ZÁKON č. ${law.number}</div><h1>${esc(law.title)}</h1><div class="document-subtitle">${esc(law.description)}</div><div class="consolidated">ve znění pozdějších předpisů</div><div class="metadata"><span>Oblast: <strong>${esc(law.category)}</strong></span><span>Účinnost: <strong>1. 1. 2026</strong></span><span>Stav: <strong style="color:var(--green)">PLATNÝ</strong></span><span>Paragrafy: <strong>${sections.length}</strong></span></div></header><section class="part"><div class="part-line"></div><div class="part-title">ČÁST PRVNÍ</div><div class="part-subtitle">ZÁKLADNÍ USTANOVENÍ</div>${content}<div class="sanction"><strong>⚖️ Sankční ustanovení</strong><br><br>${esc(sanctionFor(law))}</div><div class="amendments"><div class="amendments-title">📑 ZNĚNÍ POZDĚJŠÍCH PŘEDPISŮ</div><div class="amendments-content">Tento dokument je zobrazen ve znění pozdějších předpisů.<br><br>Poslední evidovaná změna: <strong>2026</strong></div></div><div class="info"><strong>ℹ️ Právní informace</strong><br><br>ST-CITY Laws je fiktivní právní systém vytvořený pro projekt ST-CITY. Tyto zákony nejsou právními předpisy České republiky a nemají skutečnou právní účinnost.</div><div class="document-footer">⚖️ ST-CITY Laws · Elektronická sbírka právních předpisů<br><br>© SirTros - SirTros-city</div></section></article>`;
}
function searchLaws(q){q=q.trim().toLowerCase();if(!q){home();return}const norm=q.replace("zákon č.","").replace("č.","").trim();const exact=laws.find(l=>l.number.toLowerCase()===norm);if(exact){openLaw(exact.id);return}const results=laws.filter(l=>{let t=[l.number,l.title,l.category,l.description].join(" ").toLowerCase();createSections(l).forEach((s,i)=>{t+=" § "+(i+1)+" "+s[0]+" "+s[1].join(" ")});return t.includes(q)});showResults(q,results)}
function showResults(q,results){main.innerHTML=`<div class="breadcrumb">🔎 Výsledky vyhledávání</div><div class="results"><div class="results-header">🔎 Výsledky pro <strong>„${esc(q)}“</strong> · ${results.length} výsledků</div>${results.length?results.map(l=>`<div class="result" onclick="openLaw(${l.id})"><div class="result-number">${l.icon} ZÁKON č. ${l.number}</div><div class="result-title">${esc(l.title)}</div><div class="result-description">${esc(l.description)}</div></div>`).join(""):`<div class="empty"><div class="empty-icon">🔎</div><h2>Nic jsme nenašli</h2><p>Zkus jiné slovo, číslo zákona nebo část textu.</p></div>`}</div><div class="copyright">⚖️ ST-CITY Laws · © SirTros</div>`}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem("stcity-favorites",JSON.stringify(favorites));updateFavoriteCount();const law=laws.find(x=>x.id===id);if(law)renderLaw(law)}
function updateFavoriteCount(){document.getElementById("favoriteCount").textContent=favorites.length}
function favoritesPage(){deactivateAll();const a=laws.filter(l=>favorites.includes(l.id));main.innerHTML=`<div class="breadcrumb">🏠 Domů · ⭐ Oblíbené</div><section class="category"><div class="category-head"><div class="category-title"><div class="category-icon">⭐</div><div class="category-name">Oblíbené zákony</div></div><span class="category-count">${a.length}</span></div><div class="laws" style="display:block">${a.length?a.map(lawHTML).join(""):`<div class="empty"><div class="empty-icon">⭐</div><h2>Zatím žádné oblíbené</h2><p>Klikni na ☆ u zákona a přidej ho sem.</p></div>`}</div></section><div class="copyright">⚖️ ST-CITY Laws · © SirTros</div>`;closeMobileMenu()}
function historyPage(){deactivateAll();const a=historyList.map(id=>laws.find(x=>x.id===id)).filter(Boolean);main.innerHTML=`<div class="breadcrumb">🏠 Domů · 🕘 Historie</div><section class="category"><div class="category-head"><div class="category-title"><div class="category-icon">🕘</div><div class="category-name">Historie</div></div><span class="category-count">${a.length}</span></div><div class="laws" style="display:block">${a.length?a.map(lawHTML).join(""):`<div class="empty"><div class="empty-icon">🕘</div><h2>Historie je prázdná</h2><p>Otevřené zákony se zde automaticky zobrazí.</p></div>`}</div></section><div class="copyright">⚖️ ST-CITY Laws · © SirTros</div>`;closeMobileMenu()}
function updateHistoryCount(){const e=document.getElementById("historyCount");if(e)e.textContent=historyList.length}
function aboutPage(){deactivateAll();main.innerHTML=`<div class="breadcrumb">🏠 Domů · ℹ️ O systému</div><article class="document"><header class="document-head"><div class="document-number">⚖️ ST-CITY LAWS</div><h1>O elektronické sbírce</h1><div class="document-subtitle">Fiktivní právní systém města ST-CITY</div></header><section class="part"><div class="part-line"></div><div class="part-title">ℹ️ INFORMACE</div><section class="paragraph"><div class="paragraph-heading"><span class="paragraph-symbol">§ 1</span><span class="paragraph-title">Účel sbírky</span></div><div class="odst"><div class="odst-num">(1)</div><div class="odst-text">ST-CITY Laws slouží jako elektronická sbírka fiktivních zákonů města ST-CITY.</div></div><div class="odst"><div class="odst-num">(2)</div><div class="odst-text">Jednotlivé zákony mají vlastní oblast, názvy, paragrafy, odstavce a sankční ustanovení.</div></div></section><section class="paragraph"><div class="paragraph-heading"><span class="paragraph-symbol">§ 2</span><span class="paragraph-title">DPST-C</span></div><div class="odst"><div class="odst-num">(1)</div><div class="odst-text">DPST-C je fiktivní Dopravní podnik ST-C, který je v této sbírce upraven samostatnou právní oblastí.</div></div><div class="odst"><div class="odst-num">(2)</div><div class="odst-text">Sbírka zahrnuje pravidla pro městskou dopravu, cestující, jízdní doklady, autobusovou dopravu, metro, železniční linku S1 a mimořádné situace.</div></div></section><section class="paragraph"><div class="paragraph-heading"><span class="paragraph-symbol">§ 3</span><span class="paragraph-title">Právní účinnost</span></div><div class="odst"><div class="odst-num">(1)</div><div class="odst-text">Všechny zákony v této sbírce jsou fiktivní a nemají právní účinky.</div></div></section><div class="info"><strong>⚠️ DŮLEŽITÉ UPOZORNĚNÍ</strong><br><br>ST-CITY Laws není skutečná právní databáze České republiky. Jedná se o fiktivní systém vytvořený pro projekt ST-CITY.</div><div class="document-footer">⚖️ ST-CITY Laws<br><br>© SirTros - SirTros-city</div></section></article>`;closeMobileMenu()}
function copyLaw(id){const url=location.href.split("#")[0]+"#law-"+id;if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert("🔗 Odkaz na zákon byl zkopírován."));else prompt("🔗 Zkopíruj tento odkaz:",url)}
function clearSearch(){document.getElementById("search").value="";home()}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("stcity-theme",document.body.classList.contains("dark")?"dark":"light")}
function toggleMobileMenu(){document.getElementById("sidebar").classList.toggle("mobile-open")}function closeMobileMenu(){document.getElementById("sidebar").classList.remove("mobile-open")}
function activateAll(){document.querySelectorAll(".side-btn").forEach(x=>x.classList.remove("active"));document.getElementById("allButton").classList.add("active")}function deactivateAll(){document.querySelectorAll(".side-btn").forEach(x=>x.classList.remove("active"))}
document.getElementById("search").addEventListener("input",function(){clearTimeout(window.searchTimeout);window.searchTimeout=setTimeout(()=>searchLaws(this.value),100)});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("search").focus()}if(e.key==="Escape")clearSearch()});
window.addEventListener("scroll",()=>{document.getElementById("topButton").style.display=window.scrollY>350?"block":"none"});
function openHash(){const h=location.hash;if(h.startsWith("#law-"))openLaw(Number(h.replace("#law-","")))}
buildSidebar();updateFavoriteCount();updateHistoryCount();home();openHash();
</script>
</body>
</html>
