<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ST-CITY Laws 2.0</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

:root{
    --bg:#f3f5f7;
    --panel:#ffffff;
    --panel2:#f8fafb;
    --text:#202a31;
    --muted:#74818a;
    --border:#d7dde2;
    --blue:#17577e;
    --blue2:#e8f0f5;
    --green:#34734d;
    --green-bg:#f0f8f3;
    --gold:#9b7629;
    --shadow:0 4px 18px rgba(0,0,0,.055);
}

body.dark{
    --bg:#15191d;
    --panel:#20252a;
    --panel2:#252b30;
    --text:#edf1f3;
    --muted:#aab4bb;
    --border:#3a4248;
    --blue:#69a9d0;
    --blue2:#293b48;
    --green:#75c18e;
    --green-bg:#21372a;
    --gold:#d5b35b;
    --shadow:0 5px 20px rgba(0,0,0,.25);
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    transition:.2s;
}

button,
input{
    font-family:Arial,sans-serif;
}

button{
    color:inherit;
}

.header{
    height:72px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.header-inner{
    width:min(1500px,100%);
    margin:auto;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.logo{
    width:45px;
    height:45px;
    border:1px solid var(--border);
    border-radius:9px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--panel2);
    font-size:25px;
}

.brand-title{
    color:var(--blue);
    font:bold 20px Arial,sans-serif;
}

.brand-sub{
    color:var(--muted);
    font:9px Arial,sans-serif;
    letter-spacing:1px;
    margin-top:3px;
}

.header-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.btn{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;
    transition:.15s;
}

.btn:hover{
    background:var(--panel2);
    transform:translateY(-1px);
}

.btn.primary{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
}

.mobile-menu{
    display:none;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:8px;
    font-size:20px;
    width:42px;
    height:42px;
    cursor:pointer;
}

.search-area{
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.search-inner{
    width:min(1500px,100%);
    margin:auto;
    padding:13px 22px;
}

.search{
    position:relative;
}

.search input{
    width:100%;
    height:48px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
    padding:0 46px;
    font-size:14px;
    background:var(--panel);
    color:var(--text);
}

.search input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(50,110,145,.12);
}

.search-icon{
    position:absolute;
    left:15px;
    top:12px;
    font-size:20px;
    color:var(--muted);
}

.search-clear{
    position:absolute;
    right:5px;
    top:5px;
    width:37px;
    height:37px;
    border:0;
    background:none;
    cursor:pointer;
    font-size:20px;
    color:var(--muted);
}

.search-help{
    margin-top:7px;
    color:var(--muted);
    font:10px Arial,sans-serif;
}

.layout{
    width:min(1500px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:285px 1fr;
}

.sidebar{
    background:var(--panel);
    border-right:1px solid var(--border);
    min-height:calc(100vh - 134px);
    padding-bottom:25px;
}

.side-title{
    padding:20px 18px 9px;
    color:var(--muted);
    font:bold 10px Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
}

.side-btn{
    width:100%;
    border:0;
    background:none;
    border-left:3px solid transparent;
    padding:10px 16px;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:7px;
    color:var(--text);
    cursor:pointer;
    font:12px Arial,sans-serif;
}

.side-btn:hover{
    background:var(--panel2);
}

.side-btn.active{
    background:var(--blue2);
    border-left-color:var(--blue);
    color:var(--blue);
    font-weight:bold;
}

.side-count{
    color:var(--muted);
    font-size:10px;
}

.side-line{
    height:1px;
    background:var(--border);
    margin:13px 0;
}

main{
    min-width:0;
    padding:28px 35px 80px;
}

.home-hero{
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:34px;
    border-radius:9px;
    margin-bottom:18px;
}

.hero-top{
    display:flex;
    justify-content:space-between;
    gap:25px;
    align-items:flex-start;
}

.small-title{
    color:var(--muted);
    font:bold 10px Arial,sans-serif;
    letter-spacing:1.4px;
}

.home-hero h1{
    margin:10px 0;
    font-size:35px;
    font-weight:normal;
    color:var(--blue);
}

.home-hero p{
    max-width:950px;
    color:var(--muted);
    line-height:1.75;
    font-size:15px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border:1px solid #b8d4c1;
    background:var(--green-bg);
    color:var(--green);
    border-radius:5px;
    font:bold 10px Arial,sans-serif;
}

.quick-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:22px;
}

.quick-action{
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:8px;
    padding:11px 14px;
    cursor:pointer;
    font:12px Arial,sans-serif;
}

.quick-action:hover{
    border-color:var(--blue);
    color:var(--blue);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:27px;
}

.stat{
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:8px;
    padding:17px;
}

.stat strong{
    display:block;
    color:var(--blue);
    font:bold 23px Arial,sans-serif;
}

.stat span{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font:10px Arial,sans-serif;
    text-transform:uppercase;
}

.section-title{
    color:var(--blue);
    font-size:20px;
    margin:27px 0 12px;
}

.category{
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:0 2px 10px rgba(0,0,0,.035);
    margin-bottom:13px;
    border-radius:8px;
    overflow:hidden;
}

.category-head{
    background:var(--panel2);
    border-bottom:1px solid var(--border);
    padding:16px 19px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.category-head:hover{
    background:var(--blue2);
}

.category-title{
    display:flex;
    align-items:center;
    gap:11px;
}

.category-icon{
    width:32px;
    height:32px;
    border-radius:7px;
    background:var(--blue2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.category-number{
    color:var(--blue);
    font:bold 11px Arial,sans-serif;
}

.category-name{
    color:var(--text);
    font-weight:bold;
    font-size:15px;
}

.category-count{
    color:var(--muted);
    font:10px Arial,sans-serif;
}

.laws{
    display:none;
}

.category.open .laws{
    display:block;
}

.law{
    display:grid;
    grid-template-columns:100px 1fr 38px;
    gap:14px;
    align-items:center;
    padding:15px 19px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.law:last-child{
    border-bottom:0;
}

.law:hover{
    background:var(--panel2);
}

.law-number{
    color:var(--muted);
    font:bold 10px Arial,sans-serif;
}

.law-name{
    color:var(--blue);
    font-weight:bold;
    font-size:15px;
}

.law-description{
    color:var(--muted);
    font:11px Arial,sans-serif;
    margin-top:4px;
    line-height:1.45;
}

.star{
    width:35px;
    height:35px;
    border:1px solid transparent;
    background:none;
    cursor:pointer;
    border-radius:7px;
    font-size:21px;
    color:#aeb6bc;
}

.star:hover{
    background:var(--panel2);
}

.star.active{
    color:var(--gold);
}

.breadcrumb{
    color:var(--muted);
    font:11px Arial,sans-serif;
    margin-bottom:10px;
}

.breadcrumb button{
    border:0;
    background:none;
    color:var(--blue);
    cursor:pointer;
    padding:0;
}

.toolbar{
    min-height:47px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-bottom:0;
    padding:7px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    font:11px Arial,sans-serif;
    border-radius:8px 8px 0 0;
}

.toolbar-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.document{
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:60px 80px;
    border-radius:0 0 8px 8px;
}

.document-head{
    text-align:center;
    max-width:1000px;
    margin:auto;
}

.document-number{
    color:var(--muted);
    font:bold 11px Arial,sans-serif;
    letter-spacing:1px;
}

.document h1{
    color:var(--blue);
    font-size:35px;
    font-weight:normal;
    line-height:1.25;
    margin:13px 0 9px;
}

.document-subtitle{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
}

.consolidated{
    display:inline-block;
    color:var(--muted);
    font-style:italic;
    font-size:13px;
    border-top:1px solid var(--border);
    margin-top:18px;
    padding-top:11px;
}

.metadata{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin-top:20px;
    padding-top:13px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font:10px Arial,sans-serif;
}

.metadata strong{
    color:var(--text);
}

.part{
    margin-top:52px;
}

.part-line{
    height:2px;
    background:var(--blue);
    margin-bottom:14px;
}

.part-title{
    text-align:center;
    color:var(--text);
    font-size:19px;
    font-weight:bold;
}

.part-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.paragraph{
    margin-top:43px;
    scroll-margin-top:100px;
}

.paragraph-heading{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:10px;
}

.paragraph-symbol{
    color:var(--blue);
    font-weight:bold;
    font-size:19px;
}

.paragraph-title{
    color:var(--text);
    font-size:16px;
    font-weight:bold;
}

.odst{
    display:grid;
    grid-template-columns:42px 1fr;
    gap:6px;
    padding-left:20px;
    margin:10px 0;
}

.odst-num{
    color:var(--muted);
    font-size:15px;
    font-weight:bold;
}

.odst-text{
    color:var(--text);
    font-size:15px;
    line-height:1.78;
    text-align:justify;
}

.sanction{
    margin-top:40px;
    border-left:4px solid var(--gold);
    background:rgba(190,160,75,.08);
    padding:16px 19px;
    color:var(--text);
    font:12px Arial,sans-serif;
    line-height:1.7;
}

.info{
    margin-top:30px;
    border-left:4px solid #607b8e;
    background:var(--panel2);
    padding:15px 18px;
    color:var(--muted);
    font:11px Arial,sans-serif;
    line-height:1.7;
}

.amendments{
    margin-top:38px;
    border:1px solid var(--border);
    background:var(--panel2);
}

.amendments-title{
    padding:13px 16px;
    border-bottom:1px solid var(--border);
    font:bold 10px Arial,sans-serif;
    color:var(--muted);
}

.amendments-content{
    padding:15px 17px;
    color:var(--muted);
    font:11px Arial,sans-serif;
    line-height:1.7;
}

.document-footer{
    border-top:1px solid var(--border);
    margin-top:45px;
    padding-top:16px;
    text-align:center;
    color:var(--muted);
    font:10px Arial,sans-serif;
}

.results{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
}

.results-header{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    color:var(--muted);
    font:12px Arial,sans-serif;
}

.result{
    padding:17px 21px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.result:hover{
    background:var(--panel2);
}

.result-number{
    color:var(--muted);
    font:bold 10px Arial,sans-serif;
}

.result-title{
    color:var(--blue);
    font-weight:bold;
    font-size:16px;
    margin-top:4px;
}

.result-description{
    color:var(--muted);
    font:11px Arial,sans-serif;
    margin-top:5px;
}

.empty{
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
    font:13px Arial,sans-serif;
}

.empty-icon{
    font-size:42px;
    margin-bottom:12px;
}

.copyright{
    text-align:center;
    color:var(--muted);
    font:10px Arial,sans-serif;
    padding:25px;
}

.top-button{
    position:fixed;
    right:20px;
    bottom:20px;
    width:45px;
    height:45px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--blue);
    border-radius:50%;
    cursor:pointer;
    box-shadow:var(--shadow);
    display:none;
    z-index:90;
    font-size:18px;
}

.mobile-nav{
    display:none;
}

@media(max-width:900px){

    .layout{
        grid-template-columns:225px 1fr;
    }

    main{
        padding:20px;
    }

    .document{
        padding:42px 35px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:680px){

    .header{
        height:62px;
    }

    .header-inner{
        padding:0 10px;
    }

    .header-buttons{
        display:none;
    }

    .mobile-menu{
        display:block;
    }

    .brand-title{
        font-size:17px;
    }

    .brand-sub{
        display:none;
    }

    .layout{
        display:block;
    }

    .sidebar{
        display:none;
        position:fixed;
        left:0;
        top:62px;
        bottom:0;
        width:290px;
        z-index:80;
        overflow:auto;
        box-shadow:5px 0 20px rgba(0,0,0,.15);
    }

    .sidebar.mobile-open{
        display:block;
    }

    .mobile-nav{
        display:flex;
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:58px;
        background:var(--panel);
        border-top:1px solid var(--border);
        z-index:90;
        justify-content:space-around;
    }

    .mobile-nav button{
        flex:1;
        border:0;
        background:none;
        color:var(--muted);
        font:10px Arial,sans-serif;
    }

    .mobile-nav button span{
        display:block;
        font-size:19px;
        margin-bottom:2px;
    }

    main{
        padding:10px 10px 75px;
    }

    .search-inner{
        padding:9px;
    }

    .home-hero{
        padding:22px 17px;
    }

    .hero-top{
        display:block;
    }

    .home-hero h1{
        font-size:27px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        padding:13px;
    }

    .stat strong{
        font-size:19px;
    }

    .category-head{
        padding:13px;
    }

    .law{
        grid-template-columns:68px 1fr 35px;
        padding:13px 11px;
        gap:9px;
    }

    .law-description{
        display:none;
    }

    .law-name{
        font-size:14px;
    }

    .document{
        padding:32px 16px;
    }

    .document h1{
        font-size:27px;
    }

    .odst{
        padding-left:3px;
        grid-template-columns:35px 1fr;
    }

    .odst-text{
        text-align:left;
        font-size:14px;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .toolbar-buttons{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .toolbar-buttons .btn{
        width:100%;
    }

    .quick-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .quick-action{
        text-align:center;
    }

    .top-button{
        bottom:70px;
        right:13px;
    }
}

@media print{

    @page{
        size:A4;
        margin:18mm;
    }

    body{
        background:#fff;
        color:#000;
    }

    .header,
    .search-area,
    .sidebar,
    .toolbar,
    .breadcrumb,
    .home-hero,
    .mobile-nav,
    .top-button{
        display:none!important;
    }

    .layout{
        display:block;
    }

    main{
        padding:0;
    }

    .document{
        border:0;
        box-shadow:none;
        padding:0;
    }

    .odst-text{
        font-size:12pt;
    }
}
</style>
</head>

/* ==========================================================
   ESCAPE
========================================================== */

function esc(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("search").addEventListener(
    "input",
    function(){

        clearTimeout(window.searchTimeout);

        window.searchTimeout=setTimeout(
            ()=>searchLaws(this.value),
            100
        );

    }
);


function searchLaws(query){

    query=query.trim().toLowerCase();

    if(!query){
        home();
        return;
    }

    const normalized=query
        .replace("zákon č.","")
        .replace("č.","")
        .trim();

    const exact=laws.find(
        law=>law.number.toLowerCase()===normalized
    );

    if(exact){
        openLaw(exact.id);
        return;
    }

    const results=laws.filter(law=>{

        let text=[
            law.number,
            law.title,
            law.category,
            law.description
        ].join(" ").toLowerCase();

        createSections(law).forEach(
            (section,index)=>{

                text+=" § "+(index+1);
                text+=" "+section[0];

                section[1].forEach(
                    t=>text+=" "+t
                );

            }
        );

        return text.includes(query);

    });

    showResults(query,results);
}

/* ==========================================================
   COPY LINK
========================================================== */

function copyLaw(id){

    const url=
        location.href.split("#")[0]+
        "#law-"+id;

    if(navigator.clipboard){

        navigator.clipboard.writeText(url)
        .then(()=>{
            alert("🔗 Odkaz na zákon byl zkopírován.");
        });

    }else{

        prompt(
            "🔗 Zkopíruj tento odkaz:",
            url
        );

    }

}


/* ==========================================================
   CLEAR SEARCH
========================================================== */

function clearSearch(){

    document.getElementById(
        "search"
    ).value="";

    home();

}


/* ==========================================================
   THEME
========================================================== */

function toggleTheme(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "stcity-theme",
        document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );

}


/* ==========================================================
   MOBILE MENU
========================================================== */

function toggleMobileMenu(){

    document
        .getElementById("sidebar")
        .classList.toggle("mobile-open");

}


function closeMobileMenu(){

    document
        .getElementById("sidebar")
        .classList.remove("mobile-open");

}


/* ==========================================================
   NAVIGATION
========================================================== */

function activateAll(){

    document
        .querySelectorAll(".side-btn")
        .forEach(
            x=>x.classList.remove("active")
        );

    document
        .getElementById("allButton")
        .classList.add("active");

}


function deactivateAll(){

    document
        .querySelectorAll(".side-btn")
        .forEach(
            x=>x.classList.remove("active")
        );

}


/* ==========================================================
   KEYBOARD
========================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            (event.ctrlKey||event.metaKey)
            &&
            event.key.toLowerCase()==="k"
        ){

            event.preventDefault();

            document
                .getElementById("search")
                .focus();

        }

        if(event.key==="Escape"){

            clearSearch();

        }

    }
);


/* ==========================================================
   SCROLL BUTTON
========================================================== */

window.addEventListener(
    "scroll",
    ()=>{

        const button=
            document.getElementById("topButton");

        if(window.scrollY>350){

            button.style.display="block";

        }else{

            button.style.display="none";

        }

    }
);


/* ==========================================================
   HASH NAVIGACE
========================================================== */

function openHash(){

    const hash=
        location.hash;

    if(!hash.startsWith("#law-"))
        return;

    const id=
        Number(hash.replace("#law-",""));

    if(id){
        openLaw(id);
    }

}

window.addEventListener(
    "hashchange",
    openHash
);


/* ==========================================================
   START
========================================================== */

buildSidebar();
updateFavoriteCount();
updateHistoryCount();
home();
openHash();
