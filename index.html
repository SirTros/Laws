<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ST-CITY Laws — Sbírka zákonů</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#20262c;
  font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:74px;
  background:#ffffff;
  border-bottom:1px solid #d8dde2;
  display:flex;
  align-items:center;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.topbar-inner{
  width:min(1500px,100%);
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand-icon{
  width:44px;
  height:44px;
  border:1px solid #bfc7ce;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  color:#153d5d;
  background:#f8fafb;
}

.brand-name{
  font-family:Arial,sans-serif;
  font-weight:700;
  font-size:20px;
  color:#173b59;
}

.brand-sub{
  margin-top:3px;
  font:10px Arial,sans-serif;
  color:#7b858d;
  letter-spacing:1px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.top-btn{
  background:#fff;
  border:1px solid #cdd4da;
  border-radius:5px;
  padding:9px 13px;
  color:#40505c;
  cursor:pointer;
  font:12px Arial,sans-serif;
}

.top-btn:hover{
  background:#f2f5f7;
}

/* =========================
   SEARCH
========================= */

.searchbar{
  background:#fff;
  border-bottom:1px solid #dce1e5;
}

.search-inner{
  width:min(1500px,100%);
  margin:auto;
  padding:15px 28px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  height:48px;
  border:1px solid #bcc6ce;
  border-radius:5px;
  outline:none;
  padding:0 48px;
  font:14px Arial,sans-serif;
  background:#fff;
}

.search-box input:focus{
  border-color:#3b7199;
  box-shadow:0 0 0 3px rgba(59,113,153,.10);
}

.search-icon{
  position:absolute;
  left:17px;
  top:13px;
  font:20px Arial,sans-serif;
  color:#71808a;
}

.search-clear{
  position:absolute;
  right:7px;
  top:7px;
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  color:#7d878e;
}

.search-help{
  margin-top:7px;
  font:10px Arial,sans-serif;
  color:#7d878e;
}

/* =========================
   LAYOUT
========================= */

.layout{
  width:min(1500px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:290px 1fr;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  min-height:calc(100vh - 140px);
  background:#f8f9fa;
  border-right:1px solid #d9dee2;
  padding-bottom:40px;
}

.side-title{
  padding:22px 20px 10px;
  font:bold 10px Arial,sans-serif;
  color:#7a858d;
  letter-spacing:1px;
  text-transform:uppercase;
}

.side-item{
  width:100%;
  border:0;
  border-left:3px solid transparent;
  background:transparent;
  padding:10px 18px;
  text-align:left;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#3c4a54;
  font:12px Arial,sans-serif;
}

.side-item:hover{
  background:#edf1f4;
}

.side-item.active{
  background:#e5edf3;
  border-left-color:#285e82;
  color:#174c70;
  font-weight:bold;
}

.side-count{
  color:#89949c;
  font-size:10px;
}

.side-line{
  height:1px;
  background:#dce1e5;
  margin:14px 0;
}

/* =========================
   MAIN
========================= */

main{
  padding:30px 38px 80px;
  min-width:0;
}

/* =========================
   WELCOME
========================= */

.welcome{
  background:#fff;
  border:1px solid #d5dbe0;
  box-shadow:0 3px 14px rgba(0,0,0,.055);
  padding:36px;
  margin-bottom:20px;
}

.welcome-small{
  color:#78848d;
  font:bold 10px Arial,sans-serif;
  letter-spacing:1.2px;
}

.welcome h1{
  color:#173c5b;
  font-size:34px;
  font-weight:normal;
  margin:11px 0 9px;
}

.welcome p{
  max-width:920px;
  color:#68747d;
  font-size:15px;
  line-height:1.7;
  margin:0;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:19px;
  padding:7px 11px;
  border:1px solid #b9d5c3;
  border-radius:4px;
  background:#f2f8f4;
  color:#32734c;
  font:bold 10px Arial,sans-serif;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:50px;
  border-top:1px solid #e0e4e7;
  margin-top:25px;
  padding-top:19px;
}

.stat strong{
  display:block;
  color:#23465f;
  font:bold 22px Arial,sans-serif;
}

.stat span{
  display:block;
  margin-top:3px;
  color:#7c878f;
  font:10px Arial,sans-serif;
  text-transform:uppercase;
}

/* =========================
   CATEGORY
========================= */

.category{
  background:#fff;
  border:1px solid #d5dbe0;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.category-head{
  padding:17px 21px;
  background:#f8f9fa;
  border-bottom:1px solid #dce1e5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.category-head:hover{
  background:#f1f4f6;
}

.category-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.category-number{
  color:#1e577c;
  font-weight:bold;
  font-size:17px;
}

.category-name{
  color:#273f51;
  font-size:16px;
  font-weight:bold;
}

.category-right{
  color:#7d8890;
  font:10px Arial,sans-serif;
}

.category-laws{
  display:none;
}

.category.open .category-laws{
  display:block;
}

/* =========================
   LAW LIST
========================= */

.law{
  padding:16px 22px;
  border-bottom:1px solid #e3e6e9;
  display:grid;
  grid-template-columns:100px 1fr 35px;
  gap:15px;
  align-items:center;
  cursor:pointer;
}

.law:last-child{
  border-bottom:0;
}

.law:hover{
  background:#fafbfc;
}

.law-number{
  font:bold 11px Arial,sans-serif;
  color:#687984;
}

.law-title{
  color:#14537d;
  font-size:15px;
  font-weight:bold;
}

.law-sub{
  color:#7d878f;
  font:11px Arial,sans-serif;
  margin-top:4px;
}

.star{
  border:0;
  background:none;
  cursor:pointer;
  font-size:20px;
  color:#b4bbc0;
}

.star.on{
  color:#a4771f;
}

/* =========================
   DOCUMENT
========================= */

.breadcrumb{
  margin-bottom:11px;
  font:11px Arial,sans-serif;
  color:#78848c;
}

.breadcrumb button{
  border:0;
  background:none;
  color:#185b88;
  cursor:pointer;
  padding:0;
}

.toolbar{
  min-height:46px;
  border:1px solid #d4dade;
  border-bottom:0;
  background:#f8f9fa;
  padding:7px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font:11px Arial,sans-serif;
}

.toolbar-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tool{
  border:1px solid #cbd2d7;
  border-radius:4px;
  background:#fff;
  padding:7px 10px;
  cursor:pointer;
  color:#4b5b66;
  font:11px Arial,sans-serif;
}

.tool:hover{
  background:#eef2f4;
}

.document{
  background:#fff;
  border:1px solid #d4dade;
  box-shadow:0 3px 15px rgba(0,0,0,.055);
  padding:62px 80px;
}

.doc-head{
  max-width:1000px;
  margin:auto;
  text-align:center;
}

.doc-number{
  color:#6e7b84;
  font:bold 11px Arial,sans-serif;
  letter-spacing:1px;
}

.doc-title{
  color:#173d5c;
  font-size:36px;
  line-height:1.25;
  font-weight:normal;
  margin:13px 0 8px;
}

.doc-subtitle{
  color:#68757e;
  font-size:15px;
}

.consolidated{
  display:inline-block;
  margin-top:19px;
  padding-top:12px;
  border-top:1px solid #d9dee2;
  color:#555f66;
  font-style:italic;
  font-size:14px;
}

.meta{
  margin-top:20px;
  padding-top:13px;
  border-top:1px solid #d9dee2;
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
  color:#77838b;
  font:10px Arial,sans-serif;
}

.meta strong{
  color:#3d4e59;
}

/* =========================
   LEGAL STRUCTURE
========================= */

.part{
  margin-top:55px;
}

.part-line{
  height:2px;
  background:#234f6d;
  margin-bottom:15px;
}

.part-title{
  text-align:center;
  color:#29455a;
  font-size:19px;
  font-weight:bold;
}

.part-sub{
  text-align:center;
  margin-top:5px;
  color:#7b858c;
  font-size:13px;
}

.chapter{
  margin-top:42px;
}

.chapter-title{
  text-align:center;
  font-size:17px;
  color:#2c4353;
  font-weight:bold;
  margin-bottom:27px;
}

.paragraph{
  margin-bottom:32px;
  scroll-margin-top:100px;
}

.paragraph-head{
  display:flex;
  gap:12px;
  align-items:baseline;
  margin-bottom:8px;
}

.paragraph-symbol{
  color:#15567f;
  font-weight:bold;
  font-size:19px;
}

.paragraph-title{
  color:#293f50;
  font-weight:bold;
  font-size:16px;
}

.legal-text{
  font-size:16px;
  line-height:1.82;
  text-align:justify;
  margin:0 0 7px;
}

.odst{
  display:grid;
  grid-template-columns:40px 1fr;
  gap:6px;
  padding-left:20px;
  margin:8px 0;
}

.odst-num{
  color:#586a77;
  font-weight:bold;
  font-size:15px;
}

.odst-text{
  font-size:15.5px;
  line-height:1.75;
  text-align:justify;
}

/* =========================
   REALISTIC SPECIAL BLOCKS
========================= */

.law-note{
  margin-top:30px;
  border:1px solid #d7dde1;
  background:#f8f9fa;
  padding:15px 18px;
  font:11px Arial,sans-serif;
  color:#68747d;
  line-height:1.7;
}

.sanction{
  margin-top:22px;
  border-left:4px solid #8c6b2c;
  background:#faf8f2;
  padding:14px 18px;
  color:#62583f;
  font:12px Arial,sans-serif;
  line-height:1.7;
}

/* =========================
   AMENDMENTS
========================= */

.amendments{
  border:1px solid #d5dadd;
  background:#f8f9fa;
  margin-top:45px;
}

.amendments-head{
  padding:13px 16px;
  border-bottom:1px solid #d9dee2;
  font:bold 11px Arial,sans-serif;
  color:#52616c;
}

.amendments-body{
  padding:15px 17px;
  font:11px Arial,sans-serif;
  color:#697680;
}

.amendment{
  padding:9px 0;
  border-bottom:1px solid #e0e4e7;
}

.amendment:last-child{
  border-bottom:0;
}

/* =========================
   NOTICE
========================= */

.notice{
  margin-top:28px;
  border-left:4px solid #667f91;
  background:#f4f7f8;
  padding:15px 18px;
  color:#5e6c75;
  font:11px Arial,sans-serif;
  line-height:1.7;
}

.doc-footer{
  border-top:1px solid #d9dee2;
  margin-top:45px;
  padding-top:16px;
  text-align:center;
  color:#78838a;
  font:10px Arial,sans-serif;
}

/* =========================
   RESULTS
========================= */

.results{
  background:#fff;
  border:1px solid #d4dade;
  box-shadow:0 3px 14px rgba(0,0,0,.05);
}

.results-head{
  padding:18px 21px;
  border-bottom:1px solid #dce1e5;
  color:#6d7981;
  font:12px Arial,sans-serif;
}

.result{
  padding:17px 22px;
  border-bottom:1px solid #e1e5e8;
  cursor:pointer;
}

.result:hover{
  background:#f8fafb;
}

.result-number{
  color:#6c7c86;
  font:bold 10px Arial,sans-serif;
}

.result-title{
  margin-top:4px;
  color:#14547e;
  font-size:17px;
  font-weight:bold;
}

.result-info{
  margin-top:5px;
  color:#7a858d;
  font:11px Arial,sans-serif;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:65px 20px;
  color:#77838b;
  font:13px Arial,sans-serif;
}

/* =========================
   COPYRIGHT
========================= */

.copyright{
  text-align:center;
  color:#7b858c;
  padding:25px;
  font:11px Arial,sans-serif;
}

/* =========================
   MOBILE
========================= */

.mobile-nav{
  display:none;
}

@media(max-width:850px){

  .layout{
    grid-template-columns:220px 1fr;
  }

  main{
    padding:20px;
  }

  .document{
    padding:40px 35px;
  }

}

@media(max-width:650px){

  .topbar{
    height:62px;
  }

  .topbar-inner{
    padding:0 12px;
  }

  .top-actions{
    display:none;
  }

  .brand-name{
    font-size:17px;
  }

  .brand-sub{
    display:none;
  }

  .search-inner{
    padding:10px;
  }

  .layout{
    display:block;
  }

  .sidebar{
    display:none;
  }

  .mobile-nav{
    display:block;
    padding:8px;
    background:#fff;
    border-bottom:1px solid #dce1e5;
  }

  .mobile-nav select{
    width:100%;
    height:40px;
    border:1px solid #cbd3d9;
    border-radius:4px;
    background:#fff;
  }

  main{
    padding:10px;
  }

  .welcome{
    padding:23px 18px;
  }

  .welcome h1{
    font-size:27px;
  }

  .document{
    padding:30px 17px;
  }

  .doc-title{
    font-size:28px;
  }

  .legal-text,
  .odst-text{
    text-align:left;
    font-size:15px;
  }

  .odst{
    padding-left:2px;
    grid-template-columns:31px 1fr;
  }

  .law{
    grid-template-columns:65px 1fr 30px;
    padding:14px 12px;
  }

  .law-sub{
    display:none;
  }

  .toolbar{
    flex-direction:column;
    align-items:flex-start;
  }

}

/* =========================
   PRINT
========================= */

@media print{

  @page{
    size:A4;
    margin:18mm;
  }

  body{
    background:#fff;
  }

  .topbar,
  .searchbar,
  .sidebar,
  .mobile-nav,
  .toolbar,
  .breadcrumb,
  .welcome{
    display:none!important;
  }

  .layout{
    display:block;
  }

  main{
    padding:0;
  }

  .document{
    border:0;
    box-shadow:none;
    padding:0;
  }

  .notice{
    background:#fff;
  }

  .doc-footer{
    display:block;
  }

  .doc-footer::after{
    content:" © SirTros - SirTros-city";
  }

  .legal-text,
  .odst-text{
    font-size:12pt;
  }

}

</style>
</head>

/* ======================================================
   GENERÁTOR TEXTU
====================================================== */

function generateLegalText(
  law,
  paragraph,
  odstavec
){

  const texts=[

    `Tento zákon upravuje základní pravidla pro oblast ${law.subject}.`,

    `Každá osoba je povinna při své činnosti respektovat tento zákon a postupovat tak, aby nedocházelo k nepřiměřenému zásahu do práv ostatních osob.`,

    `Osoba má právo na ochranu svých oprávněných zájmů a na rovné zacházení za podmínek stanovených právním řádem ST-CITY.`,

    `Povinnost podle tohoto zákona musí být splněna řádně, včas a způsobem, který odpovídá okolnostem konkrétního případu.`,

    `Dodržování tohoto zákona může být kontrolováno příslušným orgánem ST-CITY v rozsahu stanoveném právními předpisy.`,

    `Porušení povinnosti podle tohoto zákona se posuzuje podle závažnosti jednání, jeho následků a okolností, za kterých k porušení došlo.`,

    `Při rozhodování se přihlíží zejména k opakování protiprávního jednání, způsobené škodě a případnému ohrožení bezpečnosti osob.`,

    `Podrobnosti provádění tohoto ustanovení může stanovit prováděcí předpis ST-CITY.`

  ];


  return texts[
    (paragraph+odstavec-2)%texts.length
  ];

}

/* ======================================================
   ESCAPE
====================================================== */

function esc(text){

  return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

const search=

search.addEventListener(

function performSearch(query){

  query=
    query.trim().toLowerCase();


  if(!query){

    showHome();

    return;

  }


  /*
    číslo zákona
  */

  const numberMatch=
    query.match(
      /(\d+)\s*\/\s*2026/
    );


  if(numberMatch){

    const law=
      laws.find(
        l=>
          l.number===
          `${numberMatch[1]}/2026`
      );


    if(law){

      openLaw(law.id);

      return;

    }

  }


  /*
    hledání § a odstavce
  */

  const citation=
    query.match(
      /§\s*(\d+)(?:\s*odst\.?\s*(\d+))?/
    );


  const p=
    citation?
      Number(citation[1]):
      null;


  const o=
    citation && citation[2]?
      Number(citation[2]):
      null;


  const words=
    query
      .replace(/§/g,"")
      .replace(/odst\.?/g,"")
      .trim();


  const results=
    laws.filter(
      law=>{

        let text=
          [
            law.number,
            law.title,
            law.subject,
            law.categoryName
          ]
          .join(" ")
          .toLowerCase();


        law.paragraphs.forEach(
          paragraph=>{

            text+=
              " § "+
              paragraph.number+
              " "+
              paragraph.title;


            paragraph.sections.forEach(
              odst=>{

                text+=
                  " "+
                  odst.number+
                  " "+
                  odst.text;

              }
            );

          }
        );


        if(
          p &&
          !law.paragraphs.some(
            x=>x.number===p
          )
        ){

          return false;

        }


        return text.includes(
          words
        );

      }
    );


  showResults(
    query,
    results,
    p,
    o
  );

}

/* ======================================================
   COPY
====================================================== */

function copyLink(id){

  const link=
    location.href
    .split("#")[0]+
    "#law-"+id;


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(link);

    alert(
      "Odkaz byl zkopírován."
    );

  }

}


/* ======================================================
   UI
====================================================== */

function activateAll(){

  document
    .querySelectorAll(".side-item")
    .forEach(
      x=>
        x.classList.remove("active")
    );


  document
    .getElementById("allButton")
    .classList.add("active");

}


function deactivateAll(){

  document
    .querySelectorAll(".side-item")
    .forEach(
      x=>
        x.classList.remove("active")
    );

}


function clearSearch(){

  search.value="";

  showHome();

  search.focus();

}


/* ======================================================
   MOBILE
====================================================== */

document
  .getElementById(
    "mobileCategory"
  )
  .addEventListener(
    "change",
    function(){

      if(
        this.value==="all"
      ){

        showHome();

      }else{

        showCategory(
          this.value
        );

      }

    }
  );


/* ======================================================
   KEYBOARD
====================================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey||event.metaKey)
      &&
      event.key.toLowerCase()==="k"
    ){

      event.preventDefault();

      search.focus();

    }


    if(
      event.key==="Escape"
    ){

      clearSearch();

    }

  }
);


/* ======================================================
   INIT
====================================================== */

buildSidebar();

updateFavoriteCount();

showHome();
